add_newline = true
command_timeout = 1000
palette = "tokyonight"

format = """
$directory$git_branch$git_state$git_status
$character"""

right_format = """$status$jobs$azure$kubernetes$helm$terraform$aws$direnv$golang$python$rust$nodejs$java$lua$ruby$php$c$docker_context$cmd_duration"""

[os]
disabled = true
format = '[$symbol]($style) '
style = 'bold white'

[os.symbols]
Macos = ""
Linux = ""
Ubuntu = ""

[character]
vicmd_symbol = '[NORMAL ❯](bold green)'
success_symbol = '[➜](bold cyan)'
error_symbol = '[➜](bold red)'

[directory]
truncation_length = 3
truncate_to_repo = true
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold cyan'

[directory.substitutions]
'~/Projects/kubecraft' = ' kubecraft'
'~/.config/nvim' = ' nvim'

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
symbol = "\ue725 "
style = 'fg:#565f89'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'fg:#e0af68'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'
stashed = ''
modified = '!${count}'
staged = '+${count}'
untracked = ''
deleted = 'x${count}'
renamed = '»${count}'
conflicted = '=${count}'

# rebase/merge/cherry-pick laufend — inkl. Fortschritt (3/7)
[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = 'bold yellow'

# Exit-Code des letzten Befehls (127 vs 130 vs 1 unterscheiden)
[status]
disabled = false
format = '[$status]($style) '
style = 'bold red'

[jobs]
format = '[$symbol$number]($style) '
symbol = "\uf085 "
style = 'bold blue'

[direnv]
disabled = false
format = '[$symbol]($style) '
symbol = "\uf0ad "
style = 'bold yellow'

[helm]
format = '[$symbol]($style) '
symbol = '⎈ '
style = 'bold cyan'

[kubernetes]
# nf-md-kubernetes
symbol = "\U000F10FE "
disabled = false
format = '[$symbol$context(\($namespace\))]($style) '
style = 'fg:#565f89'
contexts = [
  { context_pattern = ".*(talos|homelab).*", style = "fg:#9ece6a", context_alias = "homelab", symbol = "\U000F10FE " },
  { context_pattern = ".*k3s.*", style = "fg:#e0af68", context_alias = "k3s", symbol = "\U000F10FE " },
  { context_pattern = ".*prod.*", style = "bold red", context_alias = "PROD", symbol = "\U000F10FE " },
  { context_pattern = ".*staging.*", style = "fg:#e0af68", context_alias = "staging", symbol = "\U000F10FE " },
]

[terraform]
format = '[$symbol$workspace]($style) '
symbol = '󱁢 '
style = 'bold purple'
disabled = false

[aws]
format = '[$symbol$profile(\($region\))]($style) '
symbol = "\uf270 "
style = 'fg:#ff9e64'
disabled = true

[azure]
# nf-md-microsoft-azure, nur symbol - subscription heisst generisch "Azure subscription 1"
format = '[$symbol]($style) '
symbol = "\U000F0163 "
style = 'fg:#7aa2f7'
disabled = false

# nur $symbol, kein $version — spart den go-/python-Aufruf pro Prompt
[golang]
format = '[$symbol]($style) '
symbol = "\ue627 "
style = 'bold cyan'

[python]
format = '[$symbol]($style) '
symbol = "\ue606 "
style = 'bold yellow'

[rust]
format = '[$symbol]($style) '
symbol = "\ue7a8 "
style = 'bold red'

[nodejs]
format = '[$symbol]($style) '
symbol = "\ue718 "
style = 'bold green'

[java]
format = '[$symbol]($style) '
symbol = "\ue738 "
style = 'bold red'

[lua]
format = '[$symbol]($style) '
symbol = "\ue620 "
style = 'bold blue'

[ruby]
format = '[$symbol]($style) '
symbol = "\ue739 "
style = 'bold red'

[php]
format = '[$symbol]($style) '
symbol = "\ue73d "
style = 'bold purple'

[c]
format = '[$symbol]($style) '
symbol = "\ue61e "
style = 'bold blue'

[docker_context]
format = '[$symbol$context]($style) '
symbol = "\uf308 "
style = 'bold blue'
disabled = true

[cmd_duration]
format = '[$duration]($style) '
style = 'bold yellow'
min_time = 2000

# tokyonight-night — gleiche Werte wie tmux + nvim
[palettes.tokyonight]
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
purple = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"
orange = "#ff9e64"
