name: lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          bash .github/scripts/shellcheck-scripts.sh

      - name: dotfiles-checks
        run: python3 .github/scripts/check-dotfiles.py
